<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật anh Cọt</title>
<style>
:root{--bg:#2a4466;--ink:#2b3a55;--paper:#fffaf2;--accent:#c9355f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);font-family:"Quicksand","Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:min(100%,calc(100vw*1.5));aspect-ratio:2/3;overflow:hidden;background:#b9c9e6;touch-action:pan-y}
.page{position:absolute;inset:0;transition:transform .7s cubic-bezier(.65,0,.25,1)}
.page img.bg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.nav{position:absolute;top:50%;z-index:20;width:44px;height:44px;margin-top:-22px;border-radius:50%;border:2px solid #fff;background:rgba(42,68,102,.55);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px)}
.nav:focus-visible,.pill:focus-visible{outline:3px solid #ffd35a;outline-offset:2px}
#prev{left:8px}#next{right:8px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:20;pointer-events:none}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5;transition:.3s}.dots i.on{opacity:1;width:22px;border-radius:5px}
.pill{position:absolute;left:50%;transform:translateX(-50%);z-index:15;border:0;border-radius:999px;background:var(--paper);color:var(--ink);font:700 clamp(13px,3.6vw,18px) inherit;font-family:inherit;padding:.7em 1.3em;cursor:pointer;box-shadow:0 4px 0 rgba(42,68,102,.35);white-space:nowrap}
.pill:active{transform:translateX(-50%) translateY(2px)}
/* envelope */
#envelope,#letter{transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .8s}
#letter{opacity:0;transform:translateY(14%) scale(.92)}
#p2.open #envelope{transform:translateY(22%) scale(.9) rotate(-3deg);opacity:0;pointer-events:none}
#p2.open #letter{opacity:1;transform:none}
#p2:not(.open){cursor:pointer}
.ring{position:absolute;left:51.5%;top:48.9%;width:20%;aspect-ratio:1;margin:-10% 0 0 -10%;border-radius:50%;border:3px solid #fff;animation:ring 1.8s ease-out infinite;pointer-events:none}
#p2.open .ring{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.5);opacity:0}}
/* flame */
#flame{position:absolute;left:50.6%;top:14.2%;width:5.2%;height:9.9%;margin-left:-2.6%;transform-origin:50% 100%;animation:flick .22s infinite alternate ease-in-out;transition:transform .15s;pointer-events:none}
#flame svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,190,90,.9))}
@keyframes flick{from{scale:1 1}to{scale:.94 1.06}}
#flame.out{animation:none;transform:scale(0);opacity:0;transition:transform .35s,opacity .35s}
#candleHit{position:absolute;left:38%;top:10%;width:25%;height:34%;z-index:5;cursor:pointer}
.smoke{position:absolute;left:50.6%;top:20%;width:3%;aspect-ratio:1;border-radius:50%;background:rgba(235,240,250,.7);filter:blur(5px);opacity:0;pointer-events:none}
.smoke.go{animation:smoke 2.4s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),-260%) scale(3)}}
#bye{position:absolute;left:0;right:0;top:44%;text-align:center;z-index:12;color:#fff;font-weight:700;font-size:clamp(22px,7vw,40px);text-shadow:0 3px 0 rgba(42,68,102,.6);opacity:0;transform:scale(.7);transition:.6s cubic-bezier(.3,1.6,.5,1);pointer-events:none;padding:0 8%;line-height:1.25}
#bye.show{opacity:1;transform:none}
#meter{position:absolute;left:50%;bottom:17%;width:40%;height:8px;margin-left:-20%;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden;z-index:15;display:none}
#meter b{display:block;height:100%;width:0;background:#fff}
#confetti{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}
.note{position:absolute;left:0;right:0;bottom:21%;text-align:center;color:#fff;font-weight:600;font-size:clamp(12px,3.2vw,16px);z-index:15;text-shadow:0 1px 3px rgba(0,0,0,.4);padding:0 10%}
@media (prefers-reduced-motion:reduce){#next,.ring,#flame{animation:none}.page{transition-duration:.01s}}
</style></head><body>

  <div id="flame"><svg viewBox="0 0 60 175" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9b0"/><stop offset=".5" stop-color="#ffc57a"/><stop offset="1" stop-color="#ff9a2a"/></linearGradient></defs><path d="M30 0C44 50 60 95 60 130a30 30 0 0 1-60 0C0 95 16 50 30 0Z" fill="url(#g)"/><path d="M30 80C38 105 46 120 46 138a16 16 0 0 1-32 0C14 120 22 105 30 80Z" fill="#ff8a1f"/></svg></div>
  <div class="smoke" id="s1"></div><div class="smoke" id="s2"></div><div class="smoke" id="s3"></div>
  <div id="candleHit" title="Chạm để thổi nến" role="button" aria-label="Thổi nến"></div>
  <div id="bye">Chúc anh Cọt<br>sinh nhật thật vui!</div>
  <div class="note" id="note">Bật mic rồi thổi thật mạnh vào điện thoại nhé</div>
  <div id="meter"><b></b></div>
  <button class="pill" id="mic" style="bottom:8%">Bật mic để thổi nến</button>
  <button class="pill" id="again" style="bottom:8%;display:none">Thắp nến lại</button>
 </section>
 <canvas id="confetti"></canvas>
 <button class="nav" id="prev" aria-label="Trang trước" hidden>‹</button>
 <button class="nav" id="next" aria-label="Trang sau">›</button>
 <div class="dots" id="dots"><i></i><i></i><i></i></div>
</main>
<script>
const $=s=>document.querySelector(s),pages=[$('#p1'),$('#p2'),$('#p3')],dots=[...document.querySelectorAll('#dots i')];
let cur=0;
function go(n){cur=Math.max(0,Math.min(2,n));pages.forEach((p,i)=>p.style.transform=`translateX(${(i-cur)*100}%)`);$('#prev').hidden=cur==0;$('#next').hidden=cur==2;dots.forEach((d,i)=>d.classList.toggle('on',i==cur));}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
$('#p1').onclick=()=>go(1);
$('#p2').onclick=()=>{if(!$('#p2').classList.contains('open')){$('#p2').classList.add('open');burst(40)}};
let sx=null;$('#stage').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)go(cur+(d<0?1:-1));sx=null});
addEventListener('keydown',e=>{if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
go(0);
/* confetti */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio}addEventListener('resize',fit);fit();
const cols=['#ff6b9d','#ffd35a','#7fe0b4','#8fb8ff','#fff','#c59bff'];
function burst(n){const w=cv.width,h=cv.height;for(let i=0;i<n;i++)parts.push({x:w/2,y:h*.45,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-4)*devicePixelRatio,s:(6+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:120});if(!raf)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});raf=parts.length?requestAnimationFrame(tick):0}
/* candle */
const flame=$('#flame'),bye=$('#bye'),meter=$('#meter'),mic=$('#mic'),again=$('#again'),note=$('#note');
let lit=true,ctx=null,stream=null,an=null,buf=null,blow=0,base=0,frames=0,last=0;
function blowOut(){if(!lit)return;lit=false;flame.classList.add('out');
 ['#s1','#s2','#s3'].forEach((s,i)=>{const e=$(s);e.style.setProperty('--dx',(i-1)*40+'%');e.style.animationDelay=i*.18+'s';e.classList.remove('go');void e.offsetWidth;e.classList.add('go')});
 bye.classList.add('show');burst(140);setTimeout(()=>burst(90),500);
 mic.style.display='none';meter.style.display='none';note.style.display='none';again.style.display='';stopMic()}
function relight(){lit=true;blow=0;flame.classList.remove('out');bye.classList.remove('show');again.style.display='none';mic.style.display='';note.style.display='';note.textContent='Bật mic rồi thổi thật mạnh vào điện thoại nhé';mic.textContent='Bật mic để thổi nến'}
function stopMic(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)ctx.close();ctx=null}
function loop(t){if(!ctx||!lit)return;an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}const rms=Math.sqrt(s/buf.length);
 frames++;if(frames<25){base=Math.max(base,rms)}else{
  const th=Math.max(.09,base*2.6),dt=Math.min(50,t-last||16);
  if(rms>th)blow+=dt;else blow=Math.max(0,blow-dt*.8);
  meter.firstElementChild.style.width=Math.min(100,blow/5)+'%';
  const lean=Math.min(1,blow/500);flame.style.transform=`rotate(${lean*14}deg) scaleY(${1-lean*.25})`;
  if(blow>500)return blowOut()}
 last=t;requestAnimationFrame(loop)}
mic.onclick=async()=>{
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Uint8Array(an.fftSize);
  blow=0;base=0;frames=0;last=0;meter.style.display='block';mic.style.display='none';note.textContent='Hít một hơi thật sâu rồi thổi vào mic nào!';requestAnimationFrame(loop)
 }catch(e){note.textContent='Không bật được mic. Anh chạm thẳng vào ngọn nến để thổi nhé.'}};
$('#candleHit').onclick=blowOut;again.onclick=relight;
</script></body></html>
